# Builds the linux/amd64 image and publishes it to the GitHub Container Registry
# (GHCR) on every push to the repository's branch. It uses the automatic
# GITHUB_TOKEN — no secret to set up. The image is
# ghcr.io/<owner>/<repository, lowercase>:latest, which is what the container
# host pulls, and also :sha-<commit>, so anybody can tell which build is which.
name: Publish image
on:
  push:
    branches: [test]
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # An image of a red build is never published.
      - run: npm test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A registry name has to be lowercase, and `github.repository` brings the
      # name as GitHub writes it (GAMERFY-MODERATOR-BOT).
      - name: The image's name, in lowercase
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
